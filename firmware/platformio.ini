[platformio]
default_envs = tank, pipe

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  256dpi/MQTT@2.5.2
  bblanchon/ArduinoJson@6.21.5
build_flags = -I include

[env:tank]
build_flags = ${env.build_flags} -DWMS_TANK=1

[env:pipe]
build_flags = ${env.build_flags} -DWMS_TANK=0
