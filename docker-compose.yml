name: iot-wms-test-rieng-nhom
# Four services; only HTTPS and authenticated MQTT/TLS are exposed to the LAN.
services:
  mysql:
    restart: unless-stopped
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run tools/setup-local.ps1}
      MYSQL_DATABASE: wms
      MYSQL_USER: wms
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run tools/setup-local.ps1}
      TZ: UTC
    command: ["--default-time-zone=+00:00", "--event-scheduler=ON", "--character-set-server=utf8mb4"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  mosquitto:
    restart: unless-stopped
    build: ./deployment/mosquitto
    environment:
      MQTT_ADMIN_USERNAME: ${MQTT_ADMIN_USERNAME:-wms-admin}
      MQTT_ADMIN_PASSWORD: ${MQTT_ADMIN_PASSWORD:?Run tools/setup-local.ps1}
    ports:
      - "${MQTT_TLS_PORT:-8883}:8883"
    volumes:
      - mqtt_data:/mosquitto/data
      - ./deployment/certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "test -s /mosquitto/data/dynamic-security.json && pidof mosquitto"]
      interval: 5s
      timeout: 3s
      retries: 15
  backend:
    restart: unless-stopped
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://wms:${MYSQL_PASSWORD}@mysql:3306/wms?charset=utf8mb4
      JWT_SECRET: ${JWT_SECRET:?Run tools/setup-local.ps1}
      MQTT_HOST: mosquitto
      MQTT_PORT: 8883
      MQTT_TLS: "true"
      MQTT_CA_FILE: /certs/ca.crt
      MQTT_USERNAME: ${MQTT_USERNAME:-backend}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_ADMIN_USERNAME: ${MQTT_ADMIN_USERNAME:-wms-admin}
      MQTT_ADMIN_PASSWORD: ${MQTT_ADMIN_PASSWORD}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:?Run tools/setup-local.ps1}
      BROKER_ADMIN: dynsec
      AUTO_CREATE_TABLES: "false"
      LOGIN_IP_MAX_ATTEMPTS: ${LOGIN_IP_MAX_ATTEMPTS:-60}
      LOGIN_IP_WINDOW_S: ${LOGIN_IP_WINDOW_S:-60}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
    volumes:
      - ./deployment/certs/ca.crt:/certs/ca.crt:ro
    depends_on:
      mysql: {condition: service_healthy}
      mosquitto: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/ready')"]
      interval: 10s
      timeout: 3s
      retries: 15
  frontend:
    restart: unless-stopped
    image: nginx:1.27-alpine
    ports:
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deployment/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deployment/certs:/certs:ro
    depends_on:
      backend: {condition: service_healthy}
volumes:
  mysql_data:
  mqtt_data:
